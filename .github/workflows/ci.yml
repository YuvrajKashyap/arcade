name: CI

on:
  push:
    branches:
      - main
      - codex/recruiter-readiness-arcade
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check
        env:
          NEXT_PUBLIC_SITE_URL: https://arcade.yuvrajkashyap.com
