name: Capture recruiter showcase

on:
  push:
    branches:
      - codex/recruiter-readiness-arcade
    paths:
      - .github/workflows/capture-recruiter-showcase.yml
      - scripts/capture-recruiter-showcase.mjs
  workflow_dispatch:
    inputs:
      capture_url:
        description: Public Arcade URL to capture
        required: false
        default: https://arcade.yuvrajkashyap.com

permissions:
  contents: write

concurrency:
  group: arcade-recruiter-showcase
  cancel-in-progress: true

jobs:
  capture:
    name: Capture all routes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install capture runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop, mobile, and interaction states
        run: node scripts/capture-recruiter-showcase.mjs
        env:
          ARCADE_CAPTURE_URL: ${{ inputs.capture_url || 'https://arcade.yuvrajkashyap.com' }}

      - name: Commit refreshed showcase assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/recruiter
          if git diff --cached --quiet; then
            echo "Showcase assets are already current."
          else
            git commit -m "docs: refresh recruiter showcase screenshots"
            git push
          fi
